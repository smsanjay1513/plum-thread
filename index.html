    <meta
      name="description"
      content="Custom knitwear, cut-and-sew apparel manufacturing, and instant GST quotation calculator from Plum & Thread in Tiruppur, India."

      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('plum-thread-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAFAFB] dark:bg-slate-950 text-[#0F172A] dark:text-slate-100 antialiased selection:bg-[#581C4C] selection:text-white dark:selection:bg-[#8E307B]">

  </body>
